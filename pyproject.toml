[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantlint"
version = "0.1.0"
description = "Quant backtest leakage/alignment scanner"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "quantlint" }]
dependencies = [
  "polars>=1.0.0",
  "typer>=0.12.0",
  "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.8.0",
]

[project.scripts]
quantlint = "quantlint.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["quantlint*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
  ".venv",
  ".mypy_cache",
  "build",
  "dist",
  "_codex",
  "quantlint_out*",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
